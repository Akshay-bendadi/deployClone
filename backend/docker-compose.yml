services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: releasetwin
      POSTGRES_PASSWORD: releasetwin
      POSTGRES_DB: releasetwin
    ports:
      - "5544:5432"
    volumes:
      - releasetwin-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U releasetwin"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  releasetwin-postgres:
