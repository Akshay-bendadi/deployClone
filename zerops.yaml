zerops:
  # -- Frontend (static Nginx) --
  - setup: frontend
    build:
      base: nodejs@22
      buildCommands:
        - cd frontend && pnpm install --frozen-lockfile --ignore-scripts
        - cd frontend && pnpm build
      deployFiles: frontend/dist/~
      envVariables:
        VITE_API_URL: https://api-1f9-8000.ny1.zerops.app
    run:
      base: static

  # -- Backend API --
  - setup: api
    build:
      base: python@latest
      buildCommands:
        - cd backend && pip install --no-cache-dir -r requirements.txt --target .packages
      deployFiles: backend/~
    run:
      base: python@latest
      ports:
        - port: 8000
          httpSupport: true
      start: sh -c 'python -m alembic upgrade head && exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000'
      envVariables:
        PYTHONPATH: .packages
        ENVIRONMENT: production
        DATABASE_URL: postgresql+psycopg://${db_user}:${db_password}@${db_hostname}:${db_port}/${db_dbName}
        VALKEY_URL: ${valkey_connectionString}
        CORS_ORIGINS: <your-frontend-subdomain-url>,http://localhost:5173
        JWT_SECRET_KEY: <generate-with-python3 -c "import secrets; print(secrets.token_hex(32))">
        FIELD_ENCRYPTION_KEY: <generate-with-python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())">
        DC_ZEROPS_API_TOKEN: <your-zerops-api-token>
        DC_ZEROPS_PROJECT_ID: <your-zerops-project-id>
        NVIDIA_API_KEY: <your-nvidia-api-key>

  # -- Background worker --
  - setup: worker
    build:
      base: python@latest
      buildCommands:
        - cd backend && pip install --no-cache-dir -r requirements.txt --target .packages
      deployFiles: backend/~
    run:
      base: python@latest
      start: sh -c 'exec python -m app.worker.worker'
      envVariables:
        PYTHONPATH: .packages
        ENVIRONMENT: production
        DATABASE_URL: postgresql+psycopg://${db_user}:${db_password}@${db_hostname}:${db_port}/${db_dbName}
        VALKEY_URL: ${valkey_connectionString}
        FIELD_ENCRYPTION_KEY: <generate-with-python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())">
        DC_ZEROPS_API_TOKEN: <your-zerops-api-token>
        DC_ZEROPS_PROJECT_ID: <your-zerops-project-id>
        NVIDIA_API_KEY: <your-nvidia-api-key>
